[package]
name = "symbiote-abiogenesis"
version = "0.5.0"
edition = "2021"
description = "Symbiote: Abiogenesis v0.5.0 (Project INFINITY) — Expansive non-repeating biosphere, aspect-aware SimCamera & minimap, procedural heritable anatomy, NEAT neural evolution, and multichannel Lenia morphology."

[features]
default = ["gpu", "observatory"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
observatory = ["gpu", "dep:winit", "dep:egui", "dep:egui-wgpu", "dep:egui-winit"]

[dependencies]
anyhow = "1"
crossterm = "0.27"
png = "0.17"
ratatui = "0.26"
rand = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
winit = { version = "0.30", optional = true }
egui = { version = "0.31", optional = true }
egui-wgpu = { version = "0.31", optional = true }
egui-winit = { version = "0.31", optional = true }
