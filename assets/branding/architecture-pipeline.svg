    <rect x="852" y="248" width="294" height="124" rx="7" fill="#121828" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="1"/>
    <text x="866" y="270" font-size="13" font-weight="700" fill="#E2E8F0">Obsidian-Glass egui 0.31 Lab</text>
    <text x="866" y="290" font-size="11" fill="#DDD6FE">• Click-to-inspect microscopic tracking</text>
    <text x="866" y="307" font-size="11" fill="#DDD6FE">• Live population &amp; nutrient sparklines</text>
    <text x="866" y="324" font-size="11" fill="#DDD6FE">• Universe generator &amp; atomic save/load</text>
    <text x="866" y="341" font-size="11" fill="#DDD6FE">• Distraction-free Cinematic Mode (H)</text>
    <text x="866" y="358" font-size="10.5" fill="#94A3B8">Headless PNG parity via --snapshot</text>
  </g>

  <!-- Bidirectional Coupling Arrows -->
  <g fill="none" stroke-width="2">
    <path d="M416,158 L462,158" stroke="#38F9D7" marker-end="url(#arrow-cyan)"/>
    <path d="M462,184 L416,184" stroke="#34D399" marker-end="url(#arrow-emerald)"/>
    <path d="M784,172 L830,172" stroke="#A78BFA" marker-end="url(#arrow-amethyst)"/>
    <path d="M416,290 C442,290 442,280 462,280" stroke="#34D399" marker-end="url(#arrow-emerald)"/>
