    <text x="498" y="177" font-size="11" fill="#C4B5FD">• Ch1: Organism Pheromone Signals</text>
    <text x="498" y="194" font-size="11" fill="#FDA4AF">• Ch2: Predation &amp; Stress Toxins</text>
    <text x="498" y="211" font-size="11" fill="#7DD3FC">• Ch3: Sinuous Mycelial Filaments</text>

    <rect x="484" y="248" width="282" height="64" rx="7" fill="#1D190C" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1"/>
