    <text x="498" y="288" font-size="10.5" fill="#FDE68A">Configurable regeneration, mutation,</text>
    <text x="498" y="302" font-size="10.5" fill="#FDE68A">catastrophes &amp; permanent extinction</text>

    <rect x="484" y="326" width="282" height="46" rx="7" fill="#0D1E2E" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="498" y="346" font-size="12" font-weight="700" fill="#E2E8F0">Symbiote Core Substrate Coupling</text>
    <text x="498" y="362" font-size="10.5" fill="#93C5FD">Particle chemistry · RuleMatrix · Ecology zones</text>
  </g>

  <!-- COLUMN 3: GPU VISUALIZATION & OBSERVATORY -->
  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <rect x="834" y="70" width="330" height="316" rx="10" fill="#0B1326" fill-opacity="0.9" stroke="#A78BFA" stroke-opacity="0.38" stroke-width="1.2"/>
    <text x="854" y="96" font-size="11.5" font-weight="700" letter-spacing="2" fill="#A78BFA">WGPU 24 · OBSERVATORY &amp; UI</text>

    <rect x="852" y="116" width="294" height="114" rx="7" fill="#141832" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="866" y="140" font-size="13.5" font-weight="700" fill="#E2E8F0">Bioluminescence Fragment Shader</text>
    <text x="866" y="160" font-size="11" fill="#BAE6FD">• Hermite-smoothed 40×40×3 bodies</text>
    <text x="866" y="177" font-size="11" fill="#BAE6FD">• Translucent membranes &amp; organelles</text>
    <text x="866" y="194" font-size="11" fill="#BAE6FD">• ACES filmic tone mapping &amp; halo</text>
